schema_version: 1
name: example
login: example-login
visibility: public
secrets:
  backends: [sops, op, bw, bws, fake]
vault:
  default: Example
  classes: { servers: Example-Servers }
signers:
  - principal: primary@example.com
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    role: primary
  - principal: backup-one@example.com
    key: sk-ssh-ed25519@openssh.com AAAAGnNrLXNzaC1lZDI1NTE5QG9wZW5zc2guY29tAAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB3NzaDoxAAAA
    role: backup
  - principal: backup-two@example.com
    key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    role: backup
host:
  alias: host-01
  user: dev
  roles: [base, ai]
